<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="islamic-star" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- 8-pointed star (Rub el Hizb) base -->
      <path d="M50 5 L63 37 L95 50 L63 63 L50 95 L37 63 L5 50 L37 37 Z" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="1" />
      
      <!-- Outer interlacing lines -->
      <path d="M0 50 L37 37 M50 0 L63 37 M100 50 L63 63 M50 100 L37 63" 
            stroke="currentColor" 
            stroke-width="0.5" />
      
      <!-- Small secondary stars at corners -->
      <circle cx="0" cy="0" r="2" fill="currentColor" opacity="0.5" />
      <circle cx="100" cy="0" r="2" fill="currentColor" opacity="0.5" />
      <circle cx="0" cy="100" r="2" fill="currentColor" opacity="0.5" />
      <circle cx="100" cy="100" r="2" fill="currentColor" opacity="0.5" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#islamic-star)" />
</svg>
